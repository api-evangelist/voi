aid: voi
name: Voi
description: Voi Technology is a Swedish micromobility company founded in Stockholm in 2018 that operates
  shared e-scooters and e-bikes in more than 100 cities across Europe. Voi publishes a Mobility-as-a-Service
  partner surface for deep integrations (register users, start and end rentals, pricing, vehicles, and
  zone areas at partners.voiapp.io), plus MDS provider and flavored GBFS feeds for cities and mobility
  partners at mds.voiapp.io.
