apis:
- name: Voi MaaS Partner API
  description: Deep-integration Mobility-as-a-Service API for partners to complete full user journeys
    inside their own apps - register users, discover vehicles by zone, get per-vehicle pricing, start
    and end rentals, and fetch zone areas (no-parking, parking-spot, slow-zone) as GeoJSON. Token authentication
    via the X-Auth-Token header. A staging environment with virtual scooters in the Berlin operational
    zone is provided for development.
  humanURL: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-pro.md
  baseURL: https://partners.voiapp.io/v1
  tags:
  - Rentals
  - Vehicles
  - Pricing
  - Users
  - Zones
  properties:
  - type: Documentation
    url: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-pro.md
- name: Voi MDS Provider API
  description: Voi's implementation of the Open Mobility Foundation Mobility Data Specification (MDS)
    provider API, giving cities and authorized partners historical trips, status changes, and a near-real-time
    events feed per operational zone. Uses OAuth 2.0 client credentials (token endpoint at mds.voiapp.io/token)
    with version negotiation through the application/vnd.mds.provider+json media type (version 0.4).
  humanURL: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-light.md
  baseURL: https://mds.voiapp.io
  tags:
  - MDS
  - Trips
  - Status Changes
  - Events
  properties:
  - type: Documentation
    url: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-light.md
- name: Voi GBFS API
  description: A flavored implementation of the General Bikeshare Feed Specification for Voi's dockless
    fleet, supporting the gbfs.json auto-discovery file, system_information, and free_bike_status per
    zone, with a proprietary X-Voigbfs-Ext header extension that adds vehicle battery state of charge.
    Authentication is shared with the MDS API (bearer token).
  humanURL: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-light.md
  baseURL: https://mds.voiapp.io/v1/gbfs
  tags:
  - GBFS
  - Vehicle Availability
  - Open Data
  properties:
  - type: Documentation
    url: https://github.com/voiapp/partner-api-docs/blob/gh-pages/maas-light.md
